[project]
name = "griptape_nodes_depth_anything_3_library"
version = "0.1.0"
description = "Depth Anything 3 integration for Griptape Nodes"
authors = [
    {name = "Griptape, Inc.", email = "hello@griptape.ai"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "griptape-nodes",
    "numpy",
    "Pillow",
]

[tool.uv.sources]
griptape-nodes = { git = "https://github.com/griptape-ai/griptape-nodes", rev = "main" }


[project.optional-dependencies]
# Execution-time only: the engine installs these into <library>/.venv-exec and puts
# them on sys.path solely inside this library's worker process. They are absent from
# the machine that only edits workflows, which is the point.
exec = [
    "torch==2.7.0",
    "torchvision==0.22.0",
    "addict",
    "moviepy",
    # Upstream declares xformers, which has no macOS wheel and builds from source. The model
    # imports it behind a try/except with a pure-torch fallback, so this installs on Windows
    # and CUDA Linux and is expected to fail the build on macOS.
    "depth-anything-3 @ git+https://github.com/ByteDance-Seed/depth-anything-3.git@2c21ea849ceec7b469a3e62ea0c0e270afc3281a",
]
# The exec extra carries a git direct reference, which hatchling rejects by default.
[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pyright>=1.1.396", "pytest-asyncio>=0.21.0", "ruff>=0.8.0", "pytest"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # Pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
]
ignore = [
  "E501", # line too long (handled by formatter)
  "B008", # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["."]
exclude = [".venv", "**/node_modules", "**/__pycache__", "**/.*", "templates"]
pythonVersion = "3.10"
reportIncompatibleMethodOverride = false
reportMissingImports = false
reportMissingModuleSource = false
reportAttributeAccessIssue = false
